<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あなたがオデュッセウスだったら</title>
<meta property="og:title" content="あなたがオデュッセウスだったら">
<meta property="og:description" content="トロイアの戦争が、やっと終わりました。あとは船で家に帰るだけです。島までは、そう遠くありません。ここから十年かかると言われても、いまは信じないでしょう。">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0b0e14;color:#e6edf3;
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       line-height:1.75;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:600px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:clamp(21px,5.6vw,29px);margin:6px 0 8px;line-height:1.4}
  .lead{color:#8b949e;font-size:14.5px;margin:0 0 20px}
  .prog{position:sticky;top:0;background:#0b0e14;padding:10px 0 12px;z-index:5}
  .bar{height:4px;background:#1c2333;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:#d4a544;width:0;transition:width .3s}
  .count{font-size:12.5px;color:#8b949e;margin-top:6px;letter-spacing:.04em}
  .scene{background:#121722;border:1px solid #222b3d;border-radius:14px;
          padding:20px 18px;margin:0 0 16px}
  .year{color:#d4a544;font-size:12.5px;letter-spacing:.1em;margin:0 0 8px}
  .sit{font-size:16px;margin:0 0 18px;color:#dbe3ec}
  .opts{display:grid;gap:10px}
  .opt{border:1px solid #2b3550;background:#161d2b;color:#e6edf3;border-radius:11px;
        padding:15px 16px;font-size:15.5px;cursor:pointer;text-align:left;
        font-family:inherit;line-height:1.6;transition:.15s}
  .opt:hover{border-color:#d4a544}
  .opt:active{transform:scale(.985)}
  .log{margin:0 0 20px}
  .logi{border-left:2px solid #2b3550;padding:2px 0 2px 14px;margin:0 0 10px;
         font-size:13.5px;color:#7d8796}
  .logi b{color:#b3bdcc;font-weight:600}
  #end{display:none} #end.on{display:block}
  .eimg{width:100%;border-radius:14px;display:block;margin:0 0 18px;background:#121722}
  .etag{color:#d4a544;font-size:13px;letter-spacing:.09em;margin:0 0 4px}
  .ename{font-size:clamp(23px,6.4vw,32px);margin:0 0 14px;line-height:1.35}
  .ebody{font-size:15.5px;color:#c9d1d9;margin:0 0 20px;white-space:pre-wrap}
  .fact{background:#121722;border-left:3px solid #58a6ff;border-radius:0 10px 10px 0;
         padding:14px 16px;margin:0 0 20px;font-size:14.5px;color:#c9d1d9}
  .fact b{color:#58a6ff;display:block;margin-bottom:5px;font-size:12.5px;
           letter-spacing:.08em}
  .warn{color:#6e7681;font-size:12.5px;margin:18px 0 0;padding:12px 14px;
         border:1px dashed #2b3550;border-radius:10px}
  .share{display:grid;gap:10px;margin:22px 0}
  .share a,.share button{display:block;text-align:center;padding:14px;border-radius:12px;
        text-decoration:none;font-weight:700;font-size:15px;border:1px solid #2b3550;
        background:#161d2b;color:#e6edf3;cursor:pointer;font-family:inherit}
  .back{display:inline-block;margin-top:6px;color:#8b949e;font-size:14px}
  footer{margin-top:32px;color:#6e7681;font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<div id="sim">
  <h1>あなたがオデュッセウスだったら</h1>
  <p class="lead">トロイアの戦争が、やっと終わりました。あとは船で家に帰るだけです。島までは、そう遠くありません。ここから十年かかると言われても、いまは信じないでしょう。</p>
  <div class="prog"><div class="bar"><i id="pbar"></i></div>
    <div class="count"><span id="pnum">1</span> / 8</div></div>
  <div class="log" id="log"></div>
  <div class="scene" id="scene"></div>
</div>

<div id="end">
  <img class="eimg" id="eimg" alt="">
  <p class="etag" id="etag"></p>
  <h1 class="ename" id="ename"></h1>
  <p class="ebody" id="ebody"></p>
  <div class="fact" id="fact"></div>
  <div class="share">
    <a id="tw" target="_blank" rel="noopener">結果をXに投稿する</a>
    <button id="again">やり直す</button>
  </div>
  <a class="back" href="../">ほかのシミュレータを見る</a>
  <p class="warn">これはシミュレータです。あなたの選択によっては史実と異なる結末になります。
  実際に起きたことは上の「史実」の欄をご覧ください。</p>
</div>

<footer>MosukeStudio</footer>
</div>

<script>
const DATA = {"title": "あなたがオデュッセウスだったら", "lead": "トロイアの戦争が、やっと終わりました。あとは船で家に帰るだけです。島までは、そう遠くありません。ここから十年かかると言われても、いまは信じないでしょう。", "axes": [{"label": "目立つか、隠れるか", "pos": "名", "neg": "無"}, {"label": "ひとりで決めるか、仲間と決めるか", "pos": "独", "neg": "協"}], "history": "物語のオデュッセウスは巨人の洞窟で本名を叫び、海の神の恨みを買います。風の袋は部下に開けられ、太陽神の牛のせいで船も部下も失いました。十年目に島へ着き、物ごいの姿で妻のもとへ帰ったと語られます。", "scenes": [{"year": "トロイア陥落の年 城の前", "situation": "十年も落ちなかった城です。力で押しても、また十年かかるかもしれません。あなたの頭には、大きな木馬の案があります。ただし、うまくいく保証はどこにもありません。仲間の王たちは、正面から攻める気でいます。", "options": [{"text": "木馬の案を自分で押し通し、中に入る兵も自分で選ぶ", "a": 2, "b": 2}, {"text": "案は出すが、王たちの合議にまかせ、正攻法にも備える", "a": 0, "b": -2}]}, {"year": "帰路 一つ目の巨人の島", "situation": "見知らぬ島に着きました。大きな洞窟があり、チーズと子羊が並んでいます。持ち主は留守のようです。船に運び込めば、すぐ出港できます。ただ、あなたは持ち主の顔を見てみたい。もてなしをもらえるかもしれません。", "options": [{"text": "持ち主を待つ。土産をもらって名乗り、客として会う", "a": 2, "b": 1}, {"text": "食べ物だけ積んで、誰にも会わずに島を離れる", "a": -2, "b": -1}]}, {"year": "洞窟の中", "situation": "入口は大岩でふさがれました。巨人ポリュペモスは部下を食べ始めています。眠っているうちに刺し殺せば、今夜は助かります。でも、あの岩はあなたたちには動かせません。中で死ぬだけです。巨人が名前を聞いてきました。", "options": [{"text": "名を「誰でもない」と偽り、酒を飲ませて目をつぶす", "a": -2, "b": 0}, {"text": "堂々と名乗り、王として取引をもちかける", "a": 2, "b": 0}]}, {"year": "脱出のあと 船の上", "situation": "羊の腹にしがみついて、全員が外に出ました。船はもう沖です。目の見えない巨人が、岸で岩を投げています。ここで黙っていれば、相手はあなたが誰か永遠に知りません。でも、この見事な手口を、誰かに知ってほしくもあります。", "options": [{"text": "振り返って「やったのはオデュッセウスだ」と叫ぶ", "a": 2, "b": 2}, {"text": "何も言わず、そのまま漕いで島を離れる", "a": -2, "b": 0}]}, {"year": "風の神アイオロスの島", "situation": "風の神から革の袋をもらいました。逆風が全部この中に入っています。開けなければ、順風だけで家まで行けます。部下には中身を言っていません。言えば、宝ではないと分かってもらえます。ただ、王だけが神に気に入られた話にはなりません。", "options": [{"text": "中身は自分だけの秘密にして、袋を舵のそばに置く", "a": 1, "b": 2}, {"text": "全員を集めて中身を明かし、見張りを交代でつける", "a": 0, "b": -2}]}, {"year": "帰路 キルケの島", "situation": "魔女キルケの島です。豚に変えられた部下は元に戻りました。キルケはもてなしてくれます。食事も寝床もあり、海は荒れていません。ただ、家は遠いままです。船を出すなら、いまが出せます。", "options": [{"text": "一年とどまり、キルケから先の海の知識をもらう", "a": -1, "b": -2}, {"text": "礼だけ言って、すぐ船を出す", "a": 1, "b": 1}]}, {"year": "帰路 セイレーンの海", "situation": "歌で船を沈める怪物がいる海です。全員が蝋で耳をふさげば、何事もなく通れます。ただし、あなたも何も聞けません。その歌は世界の全部を知っていると言われます。一度聞いたら、もう二度と機会はありません。", "options": [{"text": "自分だけ柱に縛らせ、耳を開けたまま歌を聞く", "a": 2, "b": 2}, {"text": "自分も耳をふさぎ、誰も歌を聞かずに通り抜ける", "a": -2, "b": -1}]}, {"year": "十年目 イタケの岸", "situation": "ついに自分の島です。家には求婚者が百人以上いて、財産を食いつぶしています。王として名乗り出れば、島の人は迎えてくれるかもしれません。でも、百人の中に敵がいたら、その場で終わりです。豚飼いの小屋に、ぼろの服があります。", "options": [{"text": "すぐ名乗り出て、王として広場で求婚者に会う", "a": 2, "b": -1}, {"text": "物ごいの姿で家に入り、正体を隠したまま様子を見る", "a": -2, "b": 1}]}], "endings": {"名独": {"tag": "ENDING 1", "name": "名前を残した男", "body": "あなたは自分の頭を信じ、そのたびに名前を出しました。木馬は当たり、巨人からも逃げきります。ただ、岸で叫んだ一言で海の神に追われました。十二隻の船は消え、部下はひとりも残りません。帰り着いたのは十年後、板につかまったあなただけです。それでも、名前は三千年残りました。", "image_prompt": "A lone bearded ancient Greek king clinging to a broken ship's mast in a vast wine-dark sea after a storm, distant rocky green island on the horizon, torn sail floating, pale eerie light, 19th century academic history painting, oil on canvas, dramatic chiaroscuro, no text, no letters, no words, no writing, no signage", "image": "img/名独.jpg"}, "名協": {"tag": "ENDING 2", "name": "みんなで帰った船団", "body": "あなたは目立つことを選びましたが、いつも全員に話しました。風の袋のことも隠しません。船団はまとまったまま、そこそこ早く帰り着きます。部下も生きています。ただ、語ることが少なすぎました。あなたは無事に年をとり、その帰り道を歌う人は誰もいませんでした。", "image_prompt": "A fleet of ancient Greek wooden ships with oars arriving together at a rocky Ionian harbour at sunrise, crews waving to villagers on the shore, calm sea, 19th century academic history painting, oil on canvas, warm golden light, no text, no letters, no words, no writing, no signage", "image": "img/名協.jpg"}, "無独": {"tag": "ENDING 3", "name": "誰でもない者", "body": "あなたは名乗らず、誰にも相談しませんでした。神に目をつけられない代わりに、誰もあなたを頼りません。危ない海はすべて避けて通り、船は静かに進みます。やがて島に着きますが、王だと信じる者はわずかでした。何も起きなかった十年です。物語も、残りませんでした。", "image_prompt": "A hooded man in a plain grey cloak standing alone at the stern of a small wooden ship in thick sea fog, oars dipping quietly, no other vessels in sight, 19th century academic history painting, oil on canvas, muted cold tones, no text, no letters, no words, no writing, no signage", "image": "img/無独.jpg"}, "無協": {"tag": "ENDING 4", "name": "十年目の物ごい", "body": "あなたは隠れることを選び、部下とも話しました。それでも海は長かった。島に着いたあなたは、ぼろを着て自分の家に入ります。妻はまだ機を織っていました。息子は二十歳になっています。名乗るのは、弓を引いたあとです。取り戻すのに、これだけの静けさが要りました。", "image_prompt": "A weathered beggar in rags drawing a great bow in a torchlit ancient Greek hall, stunned noblemen at long tables, a row of axe heads lined on the stone floor, 19th century academic history painting, oil on canvas, dramatic firelight, no text, no letters, no words, no writing, no signage", "image": "img/無協.jpg"}}};
let i = 0;
const score = [0, 0];
const picks = [];

const sceneEl = document.getElementById('scene');
const logEl = document.getElementById('log');

function render() {
  const s = DATA.scenes[i];
  document.getElementById('pnum').textContent = i + 1;
  document.getElementById('pbar').style.width = (i / DATA.scenes.length * 100) + '%';
  sceneEl.innerHTML = `<p class="year">${s.year}</p><p class="sit">${s.situation}</p>`;
  const box = document.createElement('div');
  box.className = 'opts';
  s.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o.text;
    b.onclick = () => choose(o);
    box.appendChild(b);
  });
  sceneEl.appendChild(box);
}

function choose(o) {
  score[0] += o.a || 0;
  score[1] += o.b || 0;
  picks.push(o.text);
  const d = document.createElement('div');
  d.className = 'logi';
  d.innerHTML = `<b>${DATA.scenes[i].year}</b> ${o.text}`;
  logEl.appendChild(d);
  i++;
  if (i < DATA.scenes.length) { render(); scrollTo(0, 0); }
  else finish();
}

function finish() {
  // 2軸の符号で4象限 → 4つの結末
  const key = (score[0] >= 0 ? DATA.axes[0].pos : DATA.axes[0].neg)
            + (score[1] >= 0 ? DATA.axes[1].pos : DATA.axes[1].neg);
  const e = DATA.endings[key] || DATA.endings[Object.keys(DATA.endings)[0]];
  document.getElementById('eimg').src = e.image;
  document.getElementById('eimg').alt = e.name;
  document.getElementById('etag').textContent = e.tag || 'ENDING';
  document.getElementById('ename').textContent = e.name;
  document.getElementById('ebody').textContent = e.body;
  document.getElementById('fact').innerHTML =
    `<b>史実では</b>${DATA.history}`;
  const txt = encodeURIComponent(
    `${DATA.title}\n私の結末は「${e.name}」でした。\n`);
  document.getElementById('tw').href =
    `https://twitter.com/intent/tweet?text=${txt}&url=${encodeURIComponent(location.href)}`;
  document.getElementById('sim').style.display = 'none';
  document.getElementById('end').classList.add('on');
  scrollTo(0, 0);
}

document.getElementById('again').onclick = () => location.reload();
render();
</script>
</body>
</html>
