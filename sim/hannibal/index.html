<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あなたがハンニバルだったら</title>
<meta property="og:title" content="あなたがハンニバルだったら">
<meta property="og:description" content="象とともにアルプスを越えた男。あなたなら、ローマを倒せますか。">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0b0e14;color:#e6edf3;
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       line-height:1.75;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:600px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:clamp(21px,5.6vw,29px);margin:6px 0 8px;line-height:1.4}
  .lead{color:#8b949e;font-size:14.5px;margin:0 0 20px}
  .prog{position:sticky;top:0;background:#0b0e14;padding:10px 0 12px;z-index:5}
  .bar{height:4px;background:#1c2333;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:#d4a544;width:0;transition:width .3s}
  .count{font-size:12.5px;color:#8b949e;margin-top:6px;letter-spacing:.04em}
  .scene{background:#121722;border:1px solid #222b3d;border-radius:14px;
          padding:20px 18px;margin:0 0 16px}
  .year{color:#d4a544;font-size:12.5px;letter-spacing:.1em;margin:0 0 8px}
  .sit{font-size:16px;margin:0 0 18px;color:#dbe3ec}
  .opts{display:grid;gap:10px}
  .opt{border:1px solid #2b3550;background:#161d2b;color:#e6edf3;border-radius:11px;
        padding:15px 16px;font-size:15.5px;cursor:pointer;text-align:left;
        font-family:inherit;line-height:1.6;transition:.15s}
  .opt:hover{border-color:#d4a544}
  .opt:active{transform:scale(.985)}
  .log{margin:0 0 20px}
  .logi{border-left:2px solid #2b3550;padding:2px 0 2px 14px;margin:0 0 10px;
         font-size:13.5px;color:#7d8796}
  .logi b{color:#b3bdcc;font-weight:600}
  #end{display:none} #end.on{display:block}
  .eimg{width:100%;border-radius:14px;display:block;margin:0 0 18px;background:#121722}
  .etag{color:#d4a544;font-size:13px;letter-spacing:.09em;margin:0 0 4px}
  .ename{font-size:clamp(23px,6.4vw,32px);margin:0 0 14px;line-height:1.35}
  .ebody{font-size:15.5px;color:#c9d1d9;margin:0 0 20px;white-space:pre-wrap}
  .fact{background:#121722;border-left:3px solid #58a6ff;border-radius:0 10px 10px 0;
         padding:14px 16px;margin:0 0 20px;font-size:14.5px;color:#c9d1d9}
  .fact b{color:#58a6ff;display:block;margin-bottom:5px;font-size:12.5px;
           letter-spacing:.08em}
  .warn{color:#6e7681;font-size:12.5px;margin:18px 0 0;padding:12px 14px;
         border:1px dashed #2b3550;border-radius:10px}
  .share{display:grid;gap:10px;margin:22px 0}
  .share a,.share button{display:block;text-align:center;padding:14px;border-radius:12px;
        text-decoration:none;font-weight:700;font-size:15px;border:1px solid #2b3550;
        background:#161d2b;color:#e6edf3;cursor:pointer;font-family:inherit}
  .back{display:inline-block;margin-top:6px;color:#8b949e;font-size:14px}
  footer{margin-top:32px;color:#6e7681;font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<div id="sim">
  <h1>あなたがハンニバルだったら</h1>
  <p class="lead">象とともにアルプスを越えた男。あなたなら、ローマを倒せますか。</p>
  <div class="prog"><div class="bar"><i id="pbar"></i></div>
    <div class="count"><span id="pnum">1</span> / 8</div></div>
  <div class="log" id="log"></div>
  <div class="scene" id="scene"></div>
</div>

<div id="end">
  <img class="eimg" id="eimg" alt="">
  <p class="etag" id="etag"></p>
  <h1 class="ename" id="ename"></h1>
  <p class="ebody" id="ebody"></p>
  <div class="fact" id="fact"></div>
  <div class="share">
    <a id="tw" target="_blank" rel="noopener">結果をXに投稿する</a>
    <button id="again">やり直す</button>
  </div>
  <a class="back" href="../">ほかのシミュレータを見る</a>
  <p class="warn">これはシミュレータです。あなたの選択によっては史実と異なる結末になります。
  実際に起きたことは上の「史実」の欄をご覧ください。</p>
</div>

<footer>MosukeStudio</footer>
</div>

<script>
const DATA = {"title": "あなたがハンニバルだったら", "lead": "象とともにアルプスを越えた男。あなたなら、ローマを倒せますか。", "axes": [{"label": "攻めるか、待つか", "pos": "攻", "neg": "慎"}, {"label": "独力で戦うか、味方を頼るか", "pos": "独", "neg": "協"}], "history": "史実のハンニバルはアルプスを越え、カンナエでローマ軍をほぼ壊滅させたと言われます。しかしローマ市は攻めず、イタリアで16年ほど粘りました。最後は本国に呼び戻され、ザマで敗れ、カルタゴは屈しました。", "scenes": [{"year": "紀元前219年 春", "situation": "スペインの町サグントゥムはローマと手を結んでいます。ここを攻めれば、ローマとの戦争は避けられません。", "options": [{"text": "町を包囲し、力ずくで落とす", "a": 2, "b": 1}, {"text": "手を出さず、スペインの支配を固める", "a": -2, "b": -1}]}, {"year": "紀元前218年 春", "situation": "ローマへ向かう道は二つ。船でイタリアを突くか、陸をゆき、山を越えるか。海はローマの艦隊が強いと言われます。", "options": [{"text": "陸路を選び、アルプスを越える", "a": 2, "b": 0}, {"text": "スペインに留まり、ローマ軍を迎え撃つ", "a": -2, "b": 0}]}, {"year": "紀元前218年 秋", "situation": "アルプスの峠は雪。兵も象も次々に倒れます。案内人の言葉も当てになりません。引き返す道はまだあります。", "options": [{"text": "犠牲を覚悟で、峠を押し通る", "a": 2, "b": 1}, {"text": "ガリアの部族に道と食料を頼み、遠回りする", "a": -1, "b": -2}]}, {"year": "紀元前217年 夏", "situation": "トラシメヌス湖のほとり。霧の深い朝、ローマの執政官の軍が細い道を進んでいます。待ち伏せの好機です。", "options": [{"text": "霧に乗じ、湖畔で全軍を伏せる", "a": 2, "b": 1}, {"text": "深追いはせず、イタリアの町々を味方に誘う", "a": -1, "b": -2}]}, {"year": "紀元前216年 夏", "situation": "カンナエの平野。ローマはおよそ8万の大軍と言われます。こちらはその半分ほど。正面から当たれば押しつぶされます。", "options": [{"text": "中央をわざと下げ、左右から包み込む", "a": 2, "b": 0}, {"text": "会戦を避け、補給を断って相手を弱らせる", "a": -2, "b": 0}]}, {"year": "紀元前216年 晩夏", "situation": "カンナエの直後。部下のマハルバルが言います。「数日でローマの城門に立てます」。だが城壁は高く、攻城の道具はありません。", "options": [{"text": "勢いのままローマ市へ進軍する", "a": 2, "b": 2}, {"text": "南イタリアの都市を味方に引き入れる", "a": -1, "b": -2}]}, {"year": "紀元前207年", "situation": "弟ハスドルバルが援軍を連れてアルプスを越えました。合流を告げる手紙を運ぶ使者が、北へ向かいます。", "options": [{"text": "北へ急進し、力ずくで合流を果たす", "a": 2, "b": -1}, {"text": "南に留まり、弟の到着を待つ", "a": -2, "b": 1}]}, {"year": "紀元前202年 秋", "situation": "ローマのスキピオが本国アフリカに上陸。ザマの地で向き合います。頼みの騎兵は、今度は相手のほうが多いのです。", "options": [{"text": "象を先頭に、正面から決戦を挑む", "a": 2, "b": 1}, {"text": "決戦を避け、有利な講和を探る", "a": -2, "b": -1}]}], "endings": {"攻独": {"tag": "ENDING 1", "name": "ローマの門に立つ者", "body": "あなたは休まず攻め続けました。カンナエの勝利のまま北へ進み、ローマの城門に迫ります。城壁は破れずとも、恐怖がローマの同盟を揺さぶりました。いくつかの都市が離れ、ローマは初めて講和の席につきます。ただし兵は減り、本国からの援軍は届きません。勝利は、薄い氷の上に立っていました。", "image_prompt": "A Carthaginian general on horseback before the towering walls of ancient Rome at dusk, war elephants and weary soldiers behind him, smoke on the horizon, dramatic chiaroscuro, 19th century academic history painting, oil on canvas, no text, no letters, no words, no writing", "image": "img/攻独.jpg"}, "攻協": {"tag": "ENDING 2", "name": "イタリアを裂いた男", "body": "あなたは攻めながら、味方を増やしました。南イタリアの都市が次々に離反し、弟の軍とも合流します。ローマは半島の半分を失い、イタリアは二つに割れました。戦争は終わらず、にらみ合いが続きます。カルタゴは滅びませんでしたが、地中海は長い緊張の海となりました。", "image_prompt": "Ancient Italian city gates opening to a Carthaginian army as local citizens greet them, olive groves and hills, warm golden light, crowds and banners without any inscription, Renaissance style history painting, oil on canvas, no text, no letters, no words, no writing", "image": "img/攻協.jpg"}, "慎独": {"tag": "ENDING 3", "name": "スペインの王", "body": "あなたはイタリアへ渡らず、スペインを固めました。銀山の富で軍を養い、独立した王国のように振る舞います。ローマとの正面衝突は避けられました。しかしローマは海を押さえ、少しずつ包囲を狭めます。あなたの名は将軍としてではなく、豊かな属州の主として残りました。", "image_prompt": "A commander overlooking silver mines and fortified hill towns in ancient Iberia, workers and pack mules below, wide sunlit landscape, calm and stately composition, classical history painting, oil on canvas, no text, no letters, no words, no writing", "image": "img/慎独.jpg"}, "慎協": {"tag": "ENDING 4", "name": "ザマの夕暮れ（史実に近い結末）", "body": "あなたはイタリアで16年ほど粘り、味方を集めました。けれどローマ市は落とせず、弟の援軍も途中で破れます。本国に呼び戻され、ザマでスキピオと戦い、敗れました。カルタゴは艦隊と領土を失い、重い賠償を負います。あなたは亡命し、異国の地で生涯を終えたと言われています。", "image_prompt": "An aging defeated general seated alone on a hillside at sunset, broken shields and fallen elephants on the plain below, distant Roman camp, melancholy mood, Romantic era history painting, oil on canvas, no text, no letters, no words, no writing", "image": "img/慎協.jpg"}}};
let i = 0;
const score = [0, 0];
const picks = [];

const sceneEl = document.getElementById('scene');
const logEl = document.getElementById('log');

function render() {
  const s = DATA.scenes[i];
  document.getElementById('pnum').textContent = i + 1;
  document.getElementById('pbar').style.width = (i / DATA.scenes.length * 100) + '%';
  sceneEl.innerHTML = `<p class="year">${s.year}</p><p class="sit">${s.situation}</p>`;
  const box = document.createElement('div');
  box.className = 'opts';
  s.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o.text;
    b.onclick = () => choose(o);
    box.appendChild(b);
  });
  sceneEl.appendChild(box);
}

function choose(o) {
  score[0] += o.a || 0;
  score[1] += o.b || 0;
  picks.push(o.text);
  const d = document.createElement('div');
  d.className = 'logi';
  d.innerHTML = `<b>${DATA.scenes[i].year}</b> ${o.text}`;
  logEl.appendChild(d);
  i++;
  if (i < DATA.scenes.length) { render(); scrollTo(0, 0); }
  else finish();
}

function finish() {
  // 2軸の符号で4象限 → 4つの結末
  const key = (score[0] >= 0 ? DATA.axes[0].pos : DATA.axes[0].neg)
            + (score[1] >= 0 ? DATA.axes[1].pos : DATA.axes[1].neg);
  const e = DATA.endings[key] || DATA.endings[Object.keys(DATA.endings)[0]];
  document.getElementById('eimg').src = e.image;
  document.getElementById('eimg').alt = e.name;
  document.getElementById('etag').textContent = e.tag || 'ENDING';
  document.getElementById('ename').textContent = e.name;
  document.getElementById('ebody').textContent = e.body;
  document.getElementById('fact').innerHTML =
    `<b>史実では</b>${DATA.history}`;
  const txt = encodeURIComponent(
    `${DATA.title}\n私の結末は「${e.name}」でした。\n`);
  document.getElementById('tw').href =
    `https://twitter.com/intent/tweet?text=${txt}&url=${encodeURIComponent(location.href)}`;
  document.getElementById('sim').style.display = 'none';
  document.getElementById('end').classList.add('on');
  scrollTo(0, 0);
}

document.getElementById('again').onclick = () => location.reload();
render();
</script>
</body>
</html>
