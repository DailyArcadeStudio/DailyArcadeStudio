<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja Dash</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0a12;font-family:'Helvetica Neue',Arial,sans-serif;}
  #ui{position:fixed;top:16px;left:0;right:0;text-align:center;color:#fff;z-index:10;pointer-events:none;}
  #score{font-size:clamp(26px,6vw,34px);font-weight:800;text-shadow:0 2px 8px #000;}
  #msg{font-size:20px;margin-top:6px;opacity:.9;text-shadow:0 2px 6px #000;}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(6,6,14,.72);z-index:20;color:#fff;transition:opacity .4s;}
  #title h1{font-size:clamp(38px,11vw,64px);margin:0 0 8px;letter-spacing:2px;text-shadow:0 4px 18px #e33;}
  #title p{font-size:clamp(14px,3.6vw,20px);opacity:.85;margin:4px 0;}
  #title .btn{margin-top:26px;padding:14px 44px;font-size:22px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#e33845,#a3202c);border:none;border-radius:12px;cursor:pointer;
    box-shadow:0 6px 24px rgba(227,56,69,.5);}
  #title .btn:hover{transform:scale(1.05);}
  .hidden{opacity:0;pointer-events:none;}
  #mute{position:fixed;top:14px;right:14px;z-index:30;border:none;cursor:pointer;
    background:rgba(12,16,26,.72);color:#fff;font-size:20px;line-height:1;
    width:44px;height:44px;border-radius:12px;}
  #mute:hover{background:rgba(30,38,56,.9);}
  /* show the hint that matches the device */
  .tc{display:none;}
  @media (pointer:coarse){ .kb{display:none;} .tc{display:block;} }
  /* a finger-sized START button on touch devices */
  @media (pointer:coarse){ #title .btn{padding:18px 56px;font-size:24px;} }

  /* --- event banner: slams into the middle of the screen --- */
  #banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:15;pointer-events:none;opacity:0;}
  #banner .b{font-size:clamp(32px,8.5vw,74px);font-weight:900;letter-spacing:.08em;color:#fff;
    padding:10px 4vw;max-width:94vw;text-align:center;transform:scale(2.4);opacity:0;
    text-shadow:0 0 26px currentColor, 0 6px 20px #000;
    border-top:5px solid currentColor;border-bottom:5px solid currentColor;}
  #banner.go .b{animation:slam .62s cubic-bezier(.12,.85,.2,1) forwards;}
  @keyframes slam{
    0%  {transform:scale(2.4) rotate(-4deg);opacity:0;}
    22% {transform:scale(1)   rotate(0deg); opacity:1;}
    70% {transform:scale(1)   rotate(0deg); opacity:1;}
    100%{transform:scale(1.12);opacity:0;}
  }

  /* --- full-screen colour flashes --- */
  #flash{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;background:#fff;}
  #vignette{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 32%,rgba(120,0,10,.85) 100%);}

  /* --- K.O. screen --- */
  #ko{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:22;pointer-events:none;opacity:0;color:#fff;transition:opacity .3s;}
  #ko.on{opacity:1;}
  #ko .koText{font-size:clamp(96px,26vw,190px);font-weight:900;letter-spacing:10px;color:#fff;
    text-shadow:0 0 40px #e33845,0 0 90px #e33845,0 10px 30px #000;
    transform:scale(3);opacity:0;}
  #ko.on .koText{animation:koSlam .8s cubic-bezier(.1,.9,.2,1) forwards;}
  @keyframes koSlam{
    0%  {transform:scale(3) rotate(-8deg);opacity:0;}
    30% {transform:scale(1) rotate(0deg);opacity:1;}
    36% {transform:scale(1.06);}
    100%{transform:scale(1);opacity:1;}
  }
  #ko .finalLabel{font-size:22px;letter-spacing:5px;opacity:0;margin-top:6px;text-shadow:0 2px 8px #000;}
  #ko .finalScore{font-size:clamp(52px,14vw,82px);font-weight:800;opacity:0;text-shadow:0 4px 20px #000;}
  #ko.on .finalLabel{animation:fadeUp .5s .75s forwards;}
  #ko.on .finalScore{animation:fadeUp .5s .9s forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div id="ui"><div id="score">0</div><div id="msg"></div></div>
<button id="mute" title="sound on/off">🔊</button>
<div id="vignette"></div>
<div id="flash"></div>
<div id="banner"><div class="b"></div></div>
<div id="ko">
  <div class="koText">K.O.</div>
  <div class="finalLabel">FINAL SCORE</div>
  <div class="finalScore">0</div>
</div>
<div id="title">
  <h1>NINJA DASH</h1>
  <p>Dodge the shuriken. Survive the run.</p>
  <p class="kb">← → / A D : move &nbsp;&nbsp; Space : jump</p>
  <p class="tc">Swipe to change lane &nbsp;&nbsp; Tap to jump</p>
  <button class="btn" id="startBtn">START</button>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ---------- url flags (declared first: sound and camera both read them) ----------
const QS = new URLSearchParams(location.search);
const AUTO = QS.get('auto')==='1';
const SHOWCASE_Q = QS.get('showcase');
// Recording must produce clean footage, so every automated mode is muted.
const SILENT = AUTO || !!SHOWCASE_Q || QS.get('mute')==='1';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x0e0e1c);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(0x0e0e1c, 22, 60);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 4.6, 8.5);
camera.lookAt(0, 1, -4);

// Portrait and landscape both have to work. A phone held upright is far
// narrower than 16:9, and with a fixed FOV the three lanes fall outside
// the frame — so widen the vertical FOV as the screen gets taller.
const BASE_FOV = 62;
function fitCamera(){
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  if(typeof SHOWCASE !== 'undefined' && SHOWCASE){
    camera.fov = aspect < 1 ? 62 : 46;
  } else {
    // keep the horizontal field roughly constant across aspect ratios
    const ref = 16/9;
    camera.fov = aspect >= ref ? BASE_FOV
      : Math.min(96, THREE.MathUtils.radToDeg(
          2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV)/2) * (ref/aspect))));
  }
  camera.__base = camera.fov;    // SPEED SURGE returns to this
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fitCamera);
addEventListener('orientationchange', ()=>setTimeout(fitCamera, 120));

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0x99aaff, 0x332222, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeecc, 2.4);
sun.position.set(6, 12, 4); sun.castShadow = true;
sun.shadow.camera.left=-14; sun.shadow.camera.right=14;
sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
scene.add(sun);

// ---------- track ----------
const LANES = [-2.4, 0, 2.4];
const trackGeo = new THREE.PlaneGeometry(9, 400);
const trackMat = new THREE.MeshStandardMaterial({color:0x3c3c52, roughness:.85});
const track = new THREE.Mesh(trackGeo, trackMat);
track.rotation.x = -Math.PI/2; track.position.z = -180; track.receiveShadow = true;
scene.add(track);
// lane lines
const laneLines = [];
for(const x of [-1.2, 1.2]){
  const line = new THREE.Mesh(new THREE.PlaneGeometry(.08, 400),
    new THREE.MeshBasicMaterial({color:0x55f0c0, transparent:true, opacity:.35}));
  line.rotation.x = -Math.PI/2; line.position.set(x, .01, -180);
  scene.add(line); laneLines.push(line);
}
// side walls (torii-red posts, parallax)
const posts = [];
const postMat = new THREE.MeshStandardMaterial({color:0xc22b35, roughness:.6});
for(let i=0;i<24;i++){
  for(const sx of [-4.6, 4.6]){
    const p = new THREE.Mesh(new THREE.BoxGeometry(.4, 3.4, .4), postMat);
    p.position.set(sx, 1.7, -i*16 - 4); p.castShadow = true;
    scene.add(p); posts.push(p);
  }
}
// moon
const moon = new THREE.Mesh(new THREE.CircleGeometry(3.4, 40),
  new THREE.MeshBasicMaterial({color:0xfff3d0}));
moon.position.set(-7, 11, -55); scene.add(moon);

// speed lines — only visible during SPEED SURGE
const speedLines = [];
const speedLineMat = new THREE.MeshBasicMaterial({color:0x9ffff0, transparent:true, opacity:0});
for(let i=0;i<40;i++){
  const m = new THREE.Mesh(new THREE.BoxGeometry(.05,.05,4), speedLineMat);
  m.position.set((Math.random()-.5)*11, .4+Math.random()*4.4, -Math.random()*70);
  scene.add(m); speedLines.push(m);
}

// ---------- ninja (primitive build, swappable with Blender glb) ----------
function buildNinja(){
  const g = new THREE.Group();
  const body = new THREE.MeshStandardMaterial({color:0x1a1c2b, roughness:.7});
  const skin = new THREE.MeshStandardMaterial({color:0xe8c19e, roughness:.6});
  const red  = new THREE.MeshStandardMaterial({color:0xc22b35, roughness:.5});
  const white= new THREE.MeshStandardMaterial({color:0xf5f5fa, roughness:.3});
  const torso = new THREE.Mesh(new THREE.SphereGeometry(.5, 24, 18), body);
  torso.scale.set(1,.85,1.1); torso.position.y = .9; g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.42, 24, 18), body);
  head.position.y = 1.75; g.add(head);
  const face = new THREE.Mesh(new THREE.BoxGeometry(.62,.24,.2), skin);
  face.position.set(0,1.78,.32); g.add(face);
  for(const s of [1,-1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.07,12,10), white);
    eye.scale.set(1,1.3,.5); eye.position.set(.16*s,1.8,.42); g.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(.032,10,8),
      new THREE.MeshBasicMaterial({color:0x101018}));
    pupil.position.set(.16*s,1.8,.465); g.add(pupil);
  }
  const band = new THREE.Mesh(new THREE.BoxGeometry(.72,.15,.5), red);
  band.position.set(0,2.02,.1); g.add(band);
  const knot = new THREE.Mesh(new THREE.BoxGeometry(.12,.3,.08), red);
  knot.position.set(.28,1.95,-.32); knot.rotation.z=.5; g.add(knot);
  const belt = new THREE.Mesh(new THREE.BoxGeometry(1.04,.14,.9), red);
  belt.position.y = .68; g.add(belt);
  const mkLimb=(x,y,len)=>{ const m=new THREE.Mesh(new THREE.CapsuleGeometry(.13,len,6,12), body);
    m.position.set(x,y,0); return m; };
  const armL=mkLimb(.62,1.02,.3), armR=mkLimb(-.62,1.02,.3);
  const legL=mkLimb(.22,.3,.28), legR=mkLimb(-.22,.3,.28);
  g.add(armL,armR,legL,legR);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  return {group:g, armL, armR, legL, legR};
}
const ninja = buildNinja();
scene.add(ninja.group);
// hero light follows the ninja
const heroLight = new THREE.PointLight(0xfff0dd, 30, 18);
heroLight.position.set(0, 5, 3);
scene.add(heroLight);

// ---------- obstacles ----------
const obstacles = [];
const shurikenGeo = (()=>{  // 4-point star
  const shape = new THREE.Shape();
  const R=.55, r=.18;
  for(let i=0;i<8;i++){
    const ang = i*Math.PI/4, rad = i%2===0 ? R : r;
    const x=Math.cos(ang)*rad, y=Math.sin(ang)*rad;
    i===0 ? shape.moveTo(x,y) : shape.lineTo(x,y);
  }
  shape.closePath();
  return new THREE.ExtrudeGeometry(shape, {depth:.1, bevelEnabled:false});
})();
const shurikenMat = new THREE.MeshStandardMaterial({color:0xb8bcc8, metalness:.85, roughness:.25});
const rockMat = new THREE.MeshStandardMaterial({color:0x4a3f38, roughness:.9});
const wallMat = new THREE.MeshStandardMaterial({color:0x2b2f45, roughness:.7, metalness:.2});
const wallTrimMat = new THREE.MeshStandardMaterial({color:0xc22b35, roughness:.5});

function spawnObstacle(z){
  const lane = LANES[Math.floor(Math.random()*3)];
  let mesh, type;
  if(Math.random()<.6){
    type='shuriken';
    mesh = new THREE.Mesh(shurikenGeo, shurikenMat);
    mesh.position.set(lane, 1.0, z);
  } else {
    type='rock';
    mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(.75), rockMat);
    mesh.position.set(lane, .75, z);
  }
  mesh.castShadow=true; scene.add(mesh);
  obstacles.push({mesh, type, lane});
}

// A wall blocks one lane completely — must be dodged sideways, never jumped.
function spawnWall(laneIdx, z){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.6, .35), wallMat);
  body.position.y = 1.3; g.add(body);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(2.2, .22, .42), wallTrimMat);
  trim.position.y = 2.6; g.add(trim);
  g.position.set(LANES[laneIdx], 0, z);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  scene.add(g);
  obstacles.push({mesh:g, type:'wall', lane:LANES[laneIdx], temp:true});
}

// ---------- boss shuriken (chases from behind) ----------
const boss = (()=>{
  const g = new THREE.Group();
  const blade = new THREE.Mesh(shurikenGeo, new THREE.MeshStandardMaterial({
    color:0xd8dce8, metalness:.9, roughness:.15, emissive:0x441018}));
  blade.scale.set(4.2,4.2,4.2); g.add(blade);
  // soft radial halo — a flat disc would read as a hard circle, so fade it out in the shader
  const glow = new THREE.Mesh(new THREE.CircleGeometry(3.2, 48), new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{c:{value:new THREE.Color(0xff3344)}},
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`uniform vec3 c; varying vec2 vUv;
      void main(){ float d=distance(vUv,vec2(.5));
        float a=pow(max(0.,1.-d*2.),2.2)*.55;
        gl_FragColor=vec4(c,a); }`,
  }));
  glow.position.z = -.4; g.add(glow);
  g.visible = false;
  scene.add(g);
  return {group:g, blade, active:false, gap:0};
})();

// ---------- game state ----------
let running=false, dead=false, t=0, speed=14, score=0, targetLane=1, jumpV=0, grounded=true;
let timeScale=1;                 // slow-motion multiplier
let deadAt=0;                    // when the run ended (touch retry gate)
let shake=0;                     // camera shake amount
let camDist=7.5, camDistTarget=7.5;   // death zoom pulls the camera in
let blackout=0;                  // >0 while lights are out
let surge=0;                     // >0 while speeding up
let nextEventAt=8;               // seconds until the first event
let eventQueue=[];               // event names not yet used in this run
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');
const titleEl = document.getElementById('title');
const bannerEl = document.getElementById('banner');
const bannerText = bannerEl.querySelector('.b');
const flashEl = document.getElementById('flash');
const vignetteEl = document.getElementById('vignette');
const koEl = document.getElementById('ko');
const koScoreEl = koEl.querySelector('.finalScore');

// ---------- presentation helpers ----------
function banner(text, color){
  bannerText.textContent = text;
  bannerText.style.color = color;
  bannerEl.classList.remove('go');
  void bannerEl.offsetWidth;      // restart the CSS animation
  bannerEl.style.opacity = 1;
  bannerEl.classList.add('go');
}
function flash(color, strength, ms){
  flashEl.style.background = color;
  flashEl.style.transition = 'none';
  flashEl.style.opacity = strength;
  requestAnimationFrame(()=>{
    flashEl.style.transition = `opacity ${ms}ms ease-out`;
    flashEl.style.opacity = 0;
  });
}

// ---------- events ----------
const EVENTS = {
  boss(){
    banner('BOSS SHURIKEN', '#ff3b4a');
    boss.active = true;
    boss.gap = 16;                       // starts behind the camera, closes in
    boss.group.visible = true;
    shake = Math.max(shake, .35);
    return 7.5;                          // how long it hounds the player
  },
  wall(){
    banner('TRIPLE WALL', '#ffd23b');
    // block two of the three lanes — one gap to thread
    const open = Math.floor(Math.random()*3);
    const z = ninja.group.position.z - 46;
    for(let l=0;l<3;l++) if(l!==open) spawnWall(l, z);
    return 4;
  },
  surge(){
    banner('SPEED SURGE', '#55f0c0');
    surge = 4.5;
    flash('#9ffff0', .35, 420);
    return 5;
  },
  blackout(){
    banner('BLACKOUT', '#9b6bff');
    blackout = 1.9;
    return 3.5;
  },
};
const EVENT_NAMES = Object.keys(EVENTS);
// recording/debug hook: fire a named event on cue (used by the capture script)
// returns false if the run is already over, so a capture script can wait
// for the next run instead of firing an event onto the K.O. screen
window.__ev = name => {
  if(!running || dead || !EVENTS[name]) return false;
  const busy = EVENTS[name]();
  if(!SILENT) SND.event(); nextEventAt = t + busy + 5; return true;
};
window.__alive = () => running && !dead;
window.__kill = () => { if(running && !dead){ dead=true; gameOver(); } };
window.__snd = () => ({enabled: SND.enabled, silent: SILENT});
window.__lane = () => targetLane;
window.__fov = () => +camera.fov.toFixed(1);
window.__air = () => !grounded;
window.__probe = () => ({t:+t.toFixed(2), gap:+boss.gap.toFixed(2), active:boss.active,
  bz:+(boss.group.position.z - camera.position.z).toFixed(2), next:+nextEventAt.toFixed(2)});

function refillEventQueue(){
  eventQueue = EVENT_NAMES.slice();
  for(let i=eventQueue.length-1;i>0;i--){        // shuffle so the order varies per run
    const j = Math.floor(Math.random()*(i+1));
    [eventQueue[i],eventQueue[j]]=[eventQueue[j],eventQueue[i]];
  }
}

function triggerEvent(){
  if(!eventQueue.length) refillEventQueue();
  const name = eventQueue.pop();
  const busy = EVENTS[name]();
  if(!SILENT) SND.event();
  nextEventAt = t + busy + 5 + Math.random()*4;  // breathing room between events
}

// ---------- reset ----------
function reset(){
  for(const o of obstacles) scene.remove(o.mesh);
  obstacles.length=0;
  let z=-24;
  for(let i=0;i<26;i++){ spawnObstacle(z); z -= 10 + Math.random()*8; }
  ninja.group.position.set(0,0,0);
  ninja.group.rotation.set(0,0,0);
  ninja.group.scale.set(1,1,1);
  targetLane=1;
  t=0; speed=14; score=0; dead=false; jumpV=0; grounded=true;
  timeScale=1; shake=0; camDist=7.5; camDistTarget=7.5;
  blackout=0; surge=0;
  boss.active=false; boss.group.visible=false;
  nextEventAt = 8;
  refillEventQueue();
  msgEl.textContent='';
  koEl.classList.remove('on');
  vignetteEl.style.transition='opacity .3s'; vignetteEl.style.opacity=0;
  camera.position.set(0,4.6,8.5);
}

const startBtn = document.getElementById('startBtn');

// ---------- sound: everything synthesised, no audio files ----------
// Keeps the single-HTML rule (nothing to download) and lets the music
// react to play: the bass line speeds up with the game, events drop a
// stinger, and the whole thing ducks out on a game over.
const SND = (() => {
  let ctx = null, master = null, musicGain = null, on = true, started = false;
  let step = 0, timer = null, tempo = 0.25;

  // A pentatonic scale never sounds wrong against itself, which matters
  // when the tempo drifts with the player's speed.
  const SCALE = [0, 3, 5, 7, 10];
  const ROOT = 220;
  const hz = (deg, oct = 0) =>
    ROOT * Math.pow(2, oct + Math.floor(deg / SCALE.length)) *
    Math.pow(2, SCALE[((deg % SCALE.length) + SCALE.length) % SCALE.length] / 12);

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.32;
    master.connect(ctx.destination);
    musicGain = ctx.createGain();
    musicGain.gain.value = 1;
    musicGain.connect(master);
    return ctx;
  }

  function blip(freq, dur, type = 'square', vol = 0.25, dest = null, slideTo = null) {
    if (!ctx || !on) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + dur);
    // a short attack stops every note from clicking
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(dest || master);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }

  function noise(dur, vol = 0.2, hp = 800) {
    if (!ctx || !on) return;
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  // --- the loop: a walking bass plus an offbeat blip ---
  function tick() {
    if (!ctx || !on) return;
    const bar = step % 16;
    if (bar % 4 === 0) blip(hz(bar === 0 ? 0 : 2, -1), tempo * 1.6, 'triangle', 0.30, musicGain);
    if (bar % 8 === 4) blip(hz(4, 0), tempo * 0.7, 'square', 0.10, musicGain);
    if (bar % 4 === 2) noise(0.05, 0.05, 4000);           // hat
    step++;
    timer = setTimeout(tick, tempo * 1000);
  }

  return {
    // must be called from a user gesture — browsers block audio otherwise
    start() {
      if (!ensure() || started) return;
      if (ctx.state === 'suspended') ctx.resume();
      started = true; step = 0; tick();
    },
    stop() { if (timer) { clearTimeout(timer); timer = null; } started = false; },
    /** speed the music up with the game; 1 = starting pace */
    setPace(mult) { tempo = Math.max(0.11, 0.25 / Math.max(0.2, mult)); },
    duck(sec = 1.6) {                                      // for game over
      if (!ctx) return;
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.setValueAtTime(musicGain.gain.value, ctx.currentTime);
      musicGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + sec);
    },
    unduck() {
      if (!ctx) return;
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      musicGain.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 0.4);
    },
    // --- one-shots ---
    move()  { ensure(); blip(660, 0.07, 'square', 0.12); },
    jump()  { ensure(); blip(420, 0.16, 'square', 0.18, null, 900); },
    land()  { ensure(); noise(0.06, 0.10, 500); },
    place() { ensure(); blip(520, 0.10, 'triangle', 0.22, null, 700); },
    event() { ensure(); [0, 90, 180].forEach((ms, i) =>
                setTimeout(() => blip(hz(2 + i, 0), 0.18, 'sawtooth', 0.20), ms)); },
    hit()   { ensure(); noise(0.35, 0.30, 200);
              blip(180, 0.5, 'sawtooth', 0.28, null, 40); },
    over()  { ensure(); [0, 140, 280, 460].forEach((ms, i) =>
                setTimeout(() => blip(hz(-i, -1), 0.42, 'triangle', 0.26), ms)); },
    toggle() { on = !on; if (!on) { this.stop(); } else { this.start(); } return on; },
    get enabled() { return on; },
  };
})();

// --- one place for every action, so touch and keyboard stay in step ---
function startRun(){
  titleEl.classList.add('hidden'); reset(); running=true;
  if(!SILENT){ SND.unduck(); SND.start(); }
}
function moveLeft(){  targetLane = Math.max(0, targetLane-1); if(!SILENT) SND.move(); }
function moveRight(){ targetLane = Math.min(2, targetLane+1); if(!SILENT) SND.move(); }
function jump(){ if(grounded){ jumpV=10.5; grounded=false; if(!SILENT) SND.jump(); } }

const muteBtn = document.getElementById('mute');
function toggleMute(){ muteBtn.textContent = SND.toggle() ? '🔊' : '🔇'; }
muteBtn.addEventListener('click', toggleMute);
muteBtn.addEventListener('touchend', e=>{ e.preventDefault(); toggleMute(); },
                         {passive:false});
if(SILENT) muteBtn.style.display='none';   // automated modes have no audio
addEventListener('keydown', e=>{ if(e.code==='KeyM') toggleMute(); });

startBtn.addEventListener('click', startRun);
// a touch on the button must start too — click alone is unreliable on touch
startBtn.addEventListener('touchend', e=>{ e.preventDefault(); startRun(); },
                          {passive:false});

addEventListener('keydown', e=>{
  if(!running){
    if(e.code==='Space'||e.code==='Enter') startRun();
    return;
  }
  if(e.code==='ArrowLeft'||e.code==='KeyA')  moveLeft();
  if(e.code==='ArrowRight'||e.code==='KeyD') moveRight();
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') jump();
});

// --- touch: swipe to change lane, tap to jump ---
// Most viewers arrive from a phone, so the game has to be playable
// without a keyboard. Swipe left/right moves, a tap jumps.
(function(){
  let sx=0, sy=0, st=0, moved=false;
  const SWIPE = 28;          // px before a drag counts as a swipe
  const canvas = renderer.domElement;

  canvas.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    sx=t.clientX; sy=t.clientY; st=Date.now(); moved=false;
  }, {passive:true});

  canvas.addEventListener('touchmove', e=>{
    if(moved || !running || dead) return;
    const t = e.changedTouches[0];
    const dx = t.clientX-sx, dy = t.clientY-sy;
    if(Math.abs(dx) > SWIPE && Math.abs(dx) > Math.abs(dy)){
      dx < 0 ? moveLeft() : moveRight();
      moved = true;                       // one lane change per swipe
    } else if(-dy > SWIPE && Math.abs(dy) > Math.abs(dx)){
      jump();                             // swipe up also jumps
      moved = true;
    }
  }, {passive:true});

  canvas.addEventListener('touchend', e=>{
    if(dead){
      // give the K.O. animation time to read, then a tap retries
      if(!AUTO && Date.now()-deadAt > 1500) startRun();
      return;
    }
    if(!running){ startRun(); return; }
    // a short touch that never became a swipe is a tap → jump
    if(!moved && Date.now()-st < 350) jump();
  }, {passive:true});

  // The title overlay sits above the canvas, so a tap anywhere on it never
  // reaches the canvas handler. Start from the overlay itself.
  titleEl.addEventListener('touchend', e=>{
    if(!running){ e.preventDefault(); startRun(); }
  }, {passive:false});

  // stop the browser treating game taps as scroll / double-tap zoom
  canvas.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
})();

// autoplay mode for recording: ?auto=1
// recording holds the K.O. longer than play does: ?hold=9000
const RETRY_MS = Math.max(1200, parseInt(QS.get('hold')||'4200', 10));
// ?noev=1 records a calm run with no events, for narration beds
const NOEV = QS.get('noev')==='1';
if(AUTO){ setTimeout(()=>{ titleEl.classList.add('hidden'); reset(); running=true; }, 1200); }

function autoPilot(){
  // find nearest obstacle ahead in current lane; dodge or jump
  // (the AI remembers obstacle positions, so BLACKOUT does not blind it)
  const nz = ninja.group.position.z;
  let nearest=null;
  for(const o of obstacles){
    if(o.mesh.position.z < nz && o.mesh.position.z > nz-16){
      if(!nearest || o.mesh.position.z > nearest.mesh.position.z) nearest=o;
    }
  }
  if(nearest){
    const curX = LANES[targetLane];
    const width = nearest.type==='wall' ? 1.5 : 1.0;
    if(Math.abs(nearest.mesh.position.x - curX) < width){
      const dz = Math.abs(nz - nearest.mesh.position.z);
      // walls cannot be jumped, so always look for an open lane
      const canJump = nearest.type==='rock' && grounded && dz<6;
      if(dz < (nearest.type==='wall' ? 13 : 9)){
        if(canJump){ jumpV=10.5; grounded=false; }
        else {
          const blocked = obstacles.filter(o =>
            o.mesh.position.z < nz && o.mesh.position.z > nz - 16);
          const options=[0,1,2].filter(l =>
            !blocked.some(o => Math.abs(LANES[l]-o.mesh.position.x) < (o.type==='wall'?1.5:1.0)));
          if(options.length) targetLane = options[Math.floor(Math.random()*options.length)];
          else {
            const loose=[0,1,2].filter(l=>Math.abs(LANES[l]-nearest.mesh.position.x)>width);
            if(loose.length) targetLane = loose[Math.floor(Math.random()*loose.length)];
          }
        }
      }
    }
  }
}

// ---------- showcase mode (?showcase=ninja|shuriken|rock|wall|boss) ----------
// Puts one object on a turntable against the dark track so the video can
// talk about it while the real thing is on screen. Uses the game's own
// meshes, so what the narration describes is exactly what ships.
const SHOWCASE = QS.get('showcase');
const showcase = {group:null, spin:.55, label:''};

function buildShowcase(name){
  const g = new THREE.Group();
  let label = '', spin = .55, y = 0, flat = false;
  if(name==='ninja'){
    const n = buildNinja();
    n.group.scale.set(1.35,1.35,1.35);
    g.add(n.group); label = 'THE NINJA'; y = -1.35; spin = .5;
    // hold a running pose so the limbs read as legs and arms, not blobs
    n.armL.rotation.x = .8; n.armR.rotation.x = -.8;
    n.legL.rotation.x = -.7; n.legR.rotation.x = .7;
  } else if(name==='shuriken'){
    const m = new THREE.Mesh(shurikenGeo, shurikenMat);
    m.scale.set(2.2,2.2,2.2); g.add(m); label = 'SHURIKEN'; spin = 1.5;
    g.rotation.x = -0.42; flat = true;   // tilt so the face reads, spin on Z
  } else if(name==='rock'){
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(.75), rockMat);
    m.scale.set(1.7,1.7,1.7); g.add(m); label = 'ROCK';
  } else if(name==='wall'){
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.6, .35), wallMat);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(2.2, .22, .42), wallTrimMat);
    trim.position.y = 1.4; body.position.y = .1; g.add(body, trim);
    label = 'WALL'; y = -0.3; spin = .45;
  } else if(name==='boss'){
    const m = new THREE.Mesh(shurikenGeo, new THREE.MeshStandardMaterial({
      color:0xd8dce8, metalness:.9, roughness:.15, emissive:0x441018}));
    m.scale.set(3.2,3.2,3.2); g.add(m); label = 'BOSS SHURIKEN'; spin = 1.1;
    g.rotation.x = -0.42; flat = true;
  }
  g.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  scene.add(g);

  // Centre the subject on the origin and pull the camera back to fit it,
  // so every object is framed the same way regardless of its size.
  const box = new THREE.Box3().setFromObject(g);
  const size = box.getSize(new THREE.Vector3());
  const mid = box.getCenter(new THREE.Vector3());
  g.position.sub(mid);                       // sit centred at the origin
  const reach = Math.max(size.x, size.y) * 0.5;
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const dist = (reach / Math.tan(fov/2)) * 1.75 + 1.0;   // 1.75 = breathing room
  camera.position.set(0, size.y*0.10, dist);

  // Slide the subject sideways so a text panel can own the other half.
  // The offset lives on a parent so the turntable still spins in place —
  // rotating an offset group would make it orbit instead.
  const bias = parseFloat(QS.get('sx') || '0');
  const pivot = new THREE.Group();
  pivot.position.x = -bias * reach * 1.15;
  scene.add(pivot);
  pivot.add(g);
  showcase.group = g; showcase.pivot = pivot;
  showcase.spin = spin; showcase.label = label; showcase.flat = flat;
}

fitCamera();          // SHOWCASE is known by here
if(SHOWCASE){
  titleEl.classList.add('hidden');
  buildShowcase(SHOWCASE);
  scoreEl.textContent = '';
  msgEl.textContent = QS.get('nolabel')==='1' ? '' : showcase.label;
  msgEl.style.fontSize = '30px';
  msgEl.style.letterSpacing = '6px';
  // a plain dark stage: nothing on screen but the subject
  track.visible = false; moon.visible = false;
  ninja.group.visible = false;          // the playable ninja is a separate object
  for(const p of posts) p.visible = false;
  for(const l of laneLines) l.visible = false;
  for(const m of speedLines) m.visible = false;
  scene.fog = null;
  scene.background = new THREE.Color(0x0b0d16);
  heroLight.position.set(2.6, 3.2, 4.2);
  heroLight.intensity = 140;
  hemi.intensity = 3.4;
  sun.intensity = 4.2; sun.position.set(2.5, 6, 6);
  // a second light from the other side so the far face is not pure black
  const fill = new THREE.PointLight(0x88aaff, 45, 26);
  fill.position.set(-4.5, 2.4, 3.6); scene.add(fill);
}
// let the capture script drive the turntable and swap subjects
window.__showcase = name => {
  if(showcase.pivot) scene.remove(showcase.pivot);   // pivot owns the group
  buildShowcase(name);
  msgEl.textContent = showcase.label;
};

// ---------- loop ----------
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const raw = Math.min(clock.getDelta(), .05);
  const dt = raw * timeScale;

  if(SHOWCASE){
    if(showcase.group){
      if(showcase.flat) showcase.group.rotation.z += raw*showcase.spin;
      else showcase.group.rotation.y += raw*showcase.spin;
    }
    camera.lookAt(0, 0, 0);        // subject is offset, camera stays on axis
    renderer.render(scene, camera);
    return;
  }

  if(running && !dead){
    t += dt;
    const surgeBoost = surge>0 ? 12 : 0;
    speed = 14 + t*.5 + surgeBoost;
    score += dt*speed;
    scoreEl.textContent = Math.floor(score);
    if(!SILENT) SND.setPace(speed/14);
    if(AUTO) autoPilot();

    // --- events ---
    if(t > nextEventAt && !NOEV) triggerEvent();

    // SPEED SURGE: extra speed + streaking lines
    if(surge>0){
      surge -= dt;
      speedLineMat.opacity = Math.min(.55, speedLineMat.opacity + dt*3);
      camera.fov += (camera.__base*1.16 - camera.fov)*Math.min(1,dt*4);
      camera.updateProjectionMatrix();
    } else if(speedLineMat.opacity > 0 || camera.fov > camera.__base + 0.05){
      speedLineMat.opacity = Math.max(0, speedLineMat.opacity - dt*1.2);
      camera.fov += (camera.__base - camera.fov)*Math.min(1,dt*3);
      camera.updateProjectionMatrix();
    }
    for(const m of speedLines){
      m.position.z += (speed*2.2)*dt;
      if(m.position.z > ninja.group.position.z + 8){
        m.position.z = ninja.group.position.z - 60 - Math.random()*20;
        m.position.x = (Math.random()-.5)*11;
        m.position.y = .4 + Math.random()*4.4;
      }
    }

    // BLACKOUT: kill the lights for a moment, then bring them back
    if(blackout>0){
      blackout -= dt;
      const k = blackout > .35 ? 0 : 1 - blackout/.35;   // fade back in at the end
      hemi.intensity = 1.5*k; sun.intensity = 2.4*k; heroLight.intensity = 30*k;
      scene.background.setHex(0x000000).lerp(SKY, k);
      scene.fog.color.copy(scene.background);
      moon.visible = k > .5;
      if(blackout<=0){
        hemi.intensity=1.5; sun.intensity=2.4; heroLight.intensity=30;
        scene.background.copy(SKY); scene.fog.color.copy(SKY); moon.visible=true;
      }
    }

    // BOSS SHURIKEN: overtakes from behind the camera, looms over the player, then peels off
    if(boss.active){
      boss.gap -= dt*3.4;                      // relentless approach
      // Hold it a little ahead of the player but still behind the camera, so the
      // blade looms large at the side of frame without blanketing the lens.
      if(boss.gap < 2.0) boss.gap = 2.0;
      // rises and slides to the left edge as it closes, keeping the player clear
      const pass = THREE.MathUtils.clamp((16 - boss.gap)/14, 0, 1);
      boss.group.position.set(ninja.group.position.x*.35 - pass*4.6,
                              2.4 + pass*2.0,
                              ninja.group.position.z + boss.gap);
      boss.blade.rotation.z += dt*7;
      shake = Math.max(shake, .08 + pass*.22);
      if(t > nextEventAt - 5.2){               // retreat before the next event
        boss.gap += dt*26;
        if(boss.gap > 30){ boss.active=false; boss.group.visible=false; }
      }
    }

    // forward
    ninja.group.position.z -= speed*dt;
    // lane
    const tx = LANES[targetLane];
    ninja.group.position.x += (tx - ninja.group.position.x)*Math.min(1, dt*12);
    ninja.group.rotation.z = (tx - ninja.group.position.x)*-.15;
    // jump
    if(!grounded){
      jumpV -= 28*dt; ninja.group.position.y += jumpV*dt;
      if(ninja.group.position.y<=0){
        ninja.group.position.y=0; grounded=true;
        if(!SILENT) SND.land();      // only reached coming out of a jump
      }
    }
    // run cycle (bob is a scale effect on limbs only — never accumulate into position.y)
    const run = Math.sin(t*14);
    ninja.armL.rotation.x =  run*.9; ninja.armR.rotation.x = -run*.9;
    ninja.legL.rotation.x = -run*.8; ninja.legR.rotation.x =  run*.8;

    // obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      if(o.type==='shuriken') o.mesh.rotation.z += dt*9;
      if(o.mesh.position.z > ninja.group.position.z + 6){
        if(o.temp){                            // event walls are one-shot
          scene.remove(o.mesh); obstacles.splice(i,1); continue;
        }
        // recycle behind player
        o.mesh.position.z -= 26*10 + Math.random()*40;
        o.mesh.position.x = LANES[Math.floor(Math.random()*3)];
      }
      // collision
      const halfW = o.type==='wall' ? 1.45 : .8;
      const dx = Math.abs(o.mesh.position.x - ninja.group.position.x);
      const dz = Math.abs(o.mesh.position.z - ninja.group.position.z);
      if(dx<halfW && dz<.7){
        const cleared = (o.type==='rock' && ninja.group.position.y > .9) ||
                        (o.type==='shuriken' && ninja.group.position.y > 1.4);
        if(!cleared){ dead=true; gameOver(o); }
      }
    }
    // hero light follows
    if(blackout<=0) heroLight.position.set(ninja.group.position.x, 5, ninja.group.position.z + 3);
    else heroLight.position.set(ninja.group.position.x, 5, ninja.group.position.z + 3);
    // moon parallax
    moon.position.z = ninja.group.position.z - 55;
    moon.position.x = -7 + ninja.group.position.x*.3;
  }

  // --- death sequence: slow-mo unwinds, camera pushes in, ninja tumbles ---
  if(dead){
    timeScale += (0 - timeScale)*Math.min(1, raw*1.1);   // ease down to a near-freeze
    ninja.group.rotation.z += raw*2.2;
    ninja.group.rotation.x -= raw*1.1;
    ninja.group.position.y += Math.max(0, 1.4 - (1-timeScale)*1.4)*raw*2;
  }

  // --- camera (runs even while dead, so the zoom and shake still play) ---
  camDist += (camDistTarget - camDist)*Math.min(1, raw*2.4);
  camera.position.z = ninja.group.position.z + camDist;
  camera.position.y = 4.2 + ninja.group.position.y*.3 - (7.5-camDist)*.22;
  camera.position.x += (ninja.group.position.x*.55 - camera.position.x)*Math.min(1,raw*6);
  if(shake>0){
    shake = Math.max(0, shake - raw*.9);
    camera.position.x += (Math.random()-.5)*shake;
    camera.position.y += (Math.random()-.5)*shake;
  }
  camera.lookAt(ninja.group.position.x*.7, 1.0, ninja.group.position.z - 2);

  renderer.render(scene, camera);
}

function gameOver(hitBy){
  running=false; deadAt=Date.now();
  if(!SILENT){ SND.hit(); SND.duck(1.6); setTimeout(()=>SND.over(), 700); }
  // hit feedback: red flash, red vignette, hard shake, camera punches in
  flash('#ff2b3a', .8, 500);
  vignetteEl.style.transition='opacity .5s'; vignetteEl.style.opacity=1;
  shake = .9;
  camDistTarget = 3.6;
  // boss keeps spinning in frame if it caused the panic
  const finalScore = Math.floor(score);
  koScoreEl.textContent = finalScore;
  msgEl.textContent = '';
  setTimeout(()=>{ koEl.classList.add('on'); }, 620);   // K.O. lands after the slow-mo
  if(AUTO){ setTimeout(()=>{ reset(); running=true; }, RETRY_MS); }
  else setTimeout(()=>{
    msgEl.textContent = matchMedia('(pointer:coarse)').matches
      ? 'Tap to retry' : 'Space to retry';
  }, 1800);
}
tick();
</script>
