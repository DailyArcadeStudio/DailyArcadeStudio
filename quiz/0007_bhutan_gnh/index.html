<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あなたの「豊かさ」のものさし診断</title>
<meta property="og:title" content="あなたの「豊かさ」のものさし診断">
<meta property="og:description" content="何を数えると、暮らしがうまくいっていると思えますか。">
<meta property="og:type" content="website">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0d1117;color:#e6edf3;
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       line-height:1.7;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:clamp(22px,6vw,30px);margin:8px 0 6px;line-height:1.4}
  .lead{color:#8b949e;font-size:15px;margin:0 0 22px}
  .story{background:#161b22;border-left:3px solid #ffd23b;border-radius:0 10px 10px 0;
          padding:14px 16px;margin:0 0 26px;font-size:14.5px;color:#c9d1d9}
  .prog{position:sticky;top:0;background:#0d1117;padding:10px 0 12px;z-index:5}
  .bar{height:5px;background:#21262d;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:#ffd23b;width:0;transition:width .25s}
  .count{font-size:13px;color:#8b949e;margin-top:6px}
  .q{margin:0 0 30px}
  .qt{font-size:17px;font-weight:700;margin:0 0 14px}
  .opts{display:grid;gap:8px}
  .opt{border:1px solid #30363d;background:#161b22;color:#e6edf3;border-radius:10px;
        padding:13px 14px;font-size:15px;cursor:pointer;text-align:left;
        font-family:inherit;transition:.15s}
  .opt:active{transform:scale(.985)}
  .opt.on{border-color:#ffd23b;background:#1c2128;color:#ffd23b;font-weight:700}
  .go{width:100%;padding:16px;border:none;border-radius:12px;background:#ffd23b;
       color:#0d1117;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;
       margin-top:8px}
  .go:disabled{background:#21262d;color:#6e7681;cursor:default}
  #result{display:none}
  #result.on{display:block}
  .rimg{width:100%;border-radius:14px;display:block;margin:0 0 18px;background:#161b22}
  .rtype{color:#ffd23b;font-size:14px;letter-spacing:.08em;margin:0 0 4px}
  .rname{font-size:clamp(24px,7vw,34px);margin:0 0 14px;line-height:1.35}
  .rbody{font-size:15.5px;color:#c9d1d9;margin:0 0 18px}
  .axes{display:grid;gap:10px;margin:0 0 24px}
  .ax{font-size:13px;color:#8b949e}
  .axbar{height:6px;background:#21262d;border-radius:3px;margin-top:5px;position:relative}
  .axbar i{position:absolute;top:0;height:100%;background:#58a6ff;border-radius:3px}
  .share{display:grid;gap:10px;margin:24px 0}
  .share a,.share button{display:block;text-align:center;padding:14px;border-radius:12px;
        text-decoration:none;font-weight:700;font-size:15px;border:1px solid #30363d;
        background:#161b22;color:#e6edf3;cursor:pointer;font-family:inherit}
  .back{display:inline-block;margin-top:8px;color:#8b949e;font-size:14px}
  footer{margin-top:34px;color:#6e7681;font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<div id="quiz">
  <h1>あなたの「豊かさ」のものさし診断</h1>
  <p class="lead">何を数えると、暮らしがうまくいっていると思えますか。</p>
  <div class="story">ヒマラヤの小さな国ブータンは、国の成績をお金だけでは測りません。健康や、時間の使い方や、近所の人を信じられるか。そういうことを、9つの分野に分けて数えていると言われています。何を数えるかで、大事にするものが変わる。その考え方から、この診断を作りました。</div>
  <div class="prog"><div class="bar"><i id="pbar"></i></div>
    <div class="count"><span id="pnum">0</span> / 10 問</div></div>
  <div id="qs"></div>
  <button class="go" id="submit" disabled>結果を見る</button>
</div>

<div id="result">
  <img class="rimg" id="rimg" alt="">
  <p class="rtype" id="rtype"></p>
  <h1 class="rname" id="rname"></h1>
  <p class="rbody" id="rbody"></p>
  <div class="axes" id="axes"></div>
  <div class="share">
    <a id="tw" target="_blank" rel="noopener">結果をXに投稿する</a>
    <button id="again">もう一度やる</button>
  </div>
  <a class="back" href="../../">ほかのゲーム・診断を見る</a>
</div>

<footer>Daily Arcade Studio</footer>
</div>

<script>
const DATA = {"title": "あなたの「豊かさ」のものさし診断", "lead": "何を数えると、暮らしがうまくいっていると思えますか。", "story": "ヒマラヤの小さな国ブータンは、国の成績をお金だけでは測りません。健康や、時間の使い方や、近所の人を信じられるか。そういうことを、9つの分野に分けて数えていると言われています。何を数えるかで、大事にするものが変わる。その考え方から、この診断を作りました。", "axes": [{"label": "お金で測るか、気持ちで測るか", "pos": "G", "neg": "H"}, {"label": "増やしていくか、残しておくか", "pos": "S", "neg": "K"}, {"label": "ひとりで決めるか、まわりと決めるか", "pos": "I", "neg": "W"}, {"label": "数字で確かめるか、実感で確かめるか", "pos": "N", "neg": "J"}], "questions": [{"text": "うまくいったかどうかは、金額で見るのがいちばん分かりやすい。", "axis": 0, "sign": 1}, {"text": "よく眠れた日は、それだけでいい1日だったと思える。", "axis": 0, "sign": -1}, {"text": "収入が増えるなら、忙しくなってもかまわない。", "axis": 0, "sign": 1}, {"text": "今より少しでも多く、先へ進んでいたい。", "axis": 1, "sign": 1}, {"text": "近所の古い木や景色は、そのまま残ってほしい。", "axis": 1, "sign": -1}, {"text": "使わずに置いてあるものは、手放したほうがいい。", "axis": 1, "sign": 1}, {"text": "大事なことは、自分ひとりで決めたい。", "axis": 2, "sign": 1}, {"text": "地域の行事には、できるだけ顔を出したい。", "axis": 2, "sign": -1}, {"text": "家計簿や歩数など、記録をつけると安心する。", "axis": 3, "sign": 1}, {"text": "調子がいいかどうかは、体の感じで分かる。", "axis": 3, "sign": -1}], "results": {"GSIN": {"name": "シンガポール型", "body": "成果を数字で確かめて、自分の判断でどんどん先へ進むタイプ。目標があると力が出ます。ただ、数えていないものは見落としやすいので、ときどき手を止めて、体の感じにも耳を傾けてみてください。", "image_prompt": "photorealistic view of a dense modern city skyline with glass towers rising above green tropical trees, elevated walkway, bright overcast daylight, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GSIN.jpg"}, "GSIJ": {"name": "ドバイ型", "body": "勢いよく積み上げていくタイプ。決めるのは自分、進み方は勘。細かい記録より、手応えを信じて動きます。速さが強みですが、たまに数字で振り返ると、行き先がはっきりします。", "image_prompt": "photorealistic desert city at golden hour, tall modern towers emerging from sand dunes, warm low sunlight, long shadows, clear sky, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GSIJ.jpg"}, "GSWN": {"name": "韓国型", "body": "まわりと足並みをそろえながら、成果をきっちり数えて伸ばしていくタイプ。頑張りどころを外しません。ただ、比べる相手が多いと疲れやすいので、自分の目盛りも持っておくと楽になります。", "image_prompt": "photorealistic view of a busy city street with tall apartment towers and green hills behind, people walking, evening lights beginning to glow, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GSWN.jpg"}, "GSWJ": {"name": "ブラジル型", "body": "人と一緒に、にぎやかに前へ進むタイプ。数字よりも場の空気で動きます。稼ぐことにも前向きですが、仲間との時間はゆずりません。細かい管理は、得意な人に任せるとうまく回ります。", "image_prompt": "photorealistic lively coastal city neighborhood on a hillside, colorful low houses, palm trees, people gathered outside in warm afternoon sunlight, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GSWJ.jpg"}, "GKIN": {"name": "スイス型", "body": "きちんと数えて、無駄なく守るタイプ。増やすことより、減らさないことを大事にします。決めるのは自分です。しっかりした土台が作れますが、たまには使ってみる日もあっていいはずです。", "image_prompt": "photorealistic alpine valley with a small stone village, snow-capped mountains behind, neat green pastures, clear cold morning light, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GKIN.jpg"}, "GKIJ": {"name": "ノルウェー型", "body": "手元のものを大切にしながら、自分のペースで暮らすタイプ。お金は必要な分だけ、あとは静かな時間に使います。記録より実感が頼り。ひとりの時間が、いちばんの充電になります。", "image_prompt": "photorealistic narrow fjord with steep green cliffs, a single small red wooden cabin at the water edge, calm water reflecting the sky, soft northern light, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GKIJ.jpg"}, "GKWN": {"name": "ドイツ型", "body": "みんなで決めた約束を守り、数字で確かめながら長く続けるタイプ。急に増やすより、壊さないことを選びます。丁寧さが信用になります。たまの寄り道も、予定に入れておくといいかもしれません。", "image_prompt": "photorealistic old European town square with timber-framed houses and a clock tower, cobblestone ground, bicycles parked, soft overcast daylight, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GKWN.jpg"}, "GKWJ": {"name": "イタリア型", "body": "古いものを残しながら、まわりと一緒に暮らしを楽しむタイプ。細かく数えはしませんが、いいか悪いかは体で分かります。稼ぎも大事、でも食卓の時間はもっと大事、という形です。", "image_prompt": "photorealistic hilltop stone village in the countryside, terracotta roofs, olive trees on the slopes, long outdoor table set under a vine canopy, warm late afternoon light, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/GKWJ.jpg"}, "HSIN": {"name": "アイスランド型", "body": "気持ちの手応えを大事にしつつ、新しいことに自分から挑むタイプ。しかも記録はきちんと取ります。小さく試して、数字で確かめて、また進む。その回し方が上手な人です。", "image_prompt": "photorealistic volcanic landscape with black rock fields, steam rising from hot springs, a small modern house in the distance, low dramatic sunlight, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HSIN.jpg"}, "HSIJ": {"name": "ニュージーランド型", "body": "心地よさを基準に、身軽に動き出すタイプ。決めるのは自分、頼りにするのは実感です。お金より、今日が気持ちよかったかどうか。外に出た日ほど、調子が上がります。", "image_prompt": "photorealistic rolling green hills with grazing sheep, a winding gravel road, distant snow-capped mountains, bright clear daylight with scattered clouds, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HSIJ.jpg"}, "HSWN": {"name": "フィンランド型", "body": "暮らしの満足を、みんなで測って良くしていくタイプ。気持ちの話も、ちゃんと数字にして考えます。静かですが、前には進みます。世界の幸福度調査で上位にくることが多い国と似た形です。", "image_prompt": "photorealistic calm lake surrounded by pine forest, a small wooden sauna cabin at the shore, wooden jetty, pale summer evening light, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HSWN.jpg"}, "HSWJ": {"name": "コスタリカ型", "body": "まわりの人と笑っていられるかを基準に、前向きに動くタイプ。数えるより、感じる。むずかしい話も、まず気分から入ります。明るさが、そのまま周りへ広がっていく形です。", "image_prompt": "photorealistic tropical green valley with a small colorful village, dense rainforest hills behind, birds flying, bright humid morning light, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HSWJ.jpg"}, "HKIN": {"name": "日本型", "body": "気持ちを大事にしながらも、きちんと数えて確かめたいタイプ。使わないものは整理し、決めるときは自分で決めます。ていねいで慎重。数字に追われすぎない日を作ると、もっと楽になります。", "image_prompt": "photorealistic quiet Japanese residential street in early morning, low houses, a narrow canal, neatly trimmed hedges, distant mountains, soft clear light, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HKIN.jpg"}, "HKIJ": {"name": "チベット高原型", "body": "静かなところで、自分のペースを守るタイプ。増やすことにも、数えることにも、あまり興味がありません。今日よく眠れたか、風が気持ちよかったか。そのくらいの物差しで、十分だと感じています。", "image_prompt": "photorealistic vast high-altitude plateau with brown grassland, a turquoise lake, snow mountains on the horizon, a lone stone hut, crisp thin air and strong sunlight, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HKIJ.jpg"}, "HKWN": {"name": "ブータン型", "body": "お金以外のものも、まわりの人と一緒にきちんと数えるタイプ。森を残すように、今あるものを守ります。眠れているか、近所を信じられるか。そこを大事にする、この動画の国と同じ考え方です。", "image_prompt": "photorealistic Himalayan valley with a white monastery with golden roof on a green mountainside, terraced fields below, morning mist between deep forested ridges, cinematic wide shot, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HKWN.jpg"}, "HKWJ": {"name": "沖縄型", "body": "近くの人と、のんびり長く暮らすタイプ。急いで増やそうとせず、今あるものでやっていきます。記録はつけませんが、調子は体で分かります。世間話が、いちばんの健康法かもしれません。", "image_prompt": "photorealistic small subtropical island village, low red-tiled roof houses behind stone walls, hibiscus flowers, a quiet lane leading to a blue sea, warm bright daylight, cinematic, ultra detailed, no text, no letters, no words, no writing, no signage", "image": "img/HKWJ.jpg"}}};
const SCALE = ["とてもそう","ややそう","どちらとも","あまり違う","全く違う"];

const qsEl = document.getElementById('qs');
const ans = new Array(DATA.questions.length).fill(null);

DATA.questions.forEach((q, i) => {
  const d = document.createElement('div');
  d.className = 'q';
  d.innerHTML = `<p class="qt">Q${i+1}. ${q.text}</p>`;
  const box = document.createElement('div');
  box.className = 'opts';
  SCALE.forEach((label, k) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = label;
    b.onclick = () => {
      ans[i] = 2 - k;                    // +2(とてもそう) 〜 -2(全く違う)
      [...box.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      update();
    };
    box.appendChild(b);
  });
  d.appendChild(box);
  qsEl.appendChild(d);
});

function update() {
  const done = ans.filter(a => a !== null).length;
  document.getElementById('pnum').textContent = done;
  document.getElementById('pbar').style.width = (done / ans.length * 100) + '%';
  document.getElementById('submit').disabled = done < ans.length;
}

document.getElementById('submit').onclick = () => {
  // 軸ごとにスコアを合計する。q.axis は 0..3、q.sign は +1/-1
  const score = [0, 0, 0, 0];
  const max = [0, 0, 0, 0];
  DATA.questions.forEach((q, i) => {
    score[q.axis] += ans[i] * q.sign;
    max[q.axis] += 2;
  });
  // 各軸を2値にして 16 タイプのキーを作る
  const key = score.map((s, i) => s >= 0 ? DATA.axes[i].pos : DATA.axes[i].neg).join('');
  const r = DATA.results[key] || DATA.results[Object.keys(DATA.results)[0]];

  document.getElementById('rimg').src = r.image;
  document.getElementById('rimg').alt = r.name;
  document.getElementById('rtype').textContent = key;
  document.getElementById('rname').textContent = r.name;
  document.getElementById('rbody').textContent = r.body;

  const ax = document.getElementById('axes');
  ax.innerHTML = '';
  DATA.axes.forEach((a, i) => {
    const pct = Math.round((score[i] + max[i]) / (max[i] * 2) * 100);
    const d = document.createElement('div');
    d.className = 'ax';
    d.innerHTML = `${a.label}<div class="axbar"><i style="left:0;width:${pct}%"></i></div>`;
    ax.appendChild(d);
  });

  const txt = encodeURIComponent(`${DATA.title}\n私は「${r.name}」でした。\n`);
  document.getElementById('tw').href =
    `https://twitter.com/intent/tweet?text=${txt}&url=${encodeURIComponent(location.href)}`;

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').classList.add('on');
  scrollTo(0, 0);
};

document.getElementById('again').onclick = () => {
  location.reload();
};
</script>
</body>
</html>
