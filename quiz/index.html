<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>診断</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d1117;color:#e6edf3;
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
  .wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:clamp(22px,5.6vw,30px);margin:6px 0 6px}
  .lead{color:#8b949e;font-size:14.5px;margin:0 0 26px}
  .grid{display:grid;gap:12px}
  .card{display:block;text-decoration:none;color:inherit;background:#161b22;
         border:1px solid #21262d;border-radius:14px;padding:18px 16px;transition:.15s}
  .card:hover{border-color:#ffd23b}
  .card h2{font-size:17px;margin:0 0 5px}
  .card p{font-size:14px;color:#8b949e;margin:0}
  .pill{display:inline-block;font-size:11.5px;color:#ffd23b;border:1px solid #21262d;
         border-radius:20px;padding:2px 10px;margin-top:10px}
  footer{margin-top:34px;color:#6e7681;font-size:12.5px;text-align:center}
</style></head>
<body><div class="wrap">
<h1>診断</h1>
<p class="lead">10問に答えると、自分がどのタイプに近いか分かります。</p>
<div class="grid" id="grid">
  <a class="card" href="finland-distance/"><h2>あなたのパーソナルスペース診断</h2><p>人との距離のとり方から、16タイプに分かれます。</p><span class="pill">10問</span></a>
</div>
<footer>Daily Arcade Studio</footer>
</div></body></html>
